# Formal Releases are intentionally blocked until every listed acceptance item is met.
[release]
stable_release_ready = false
blockers = [
  "No physical target/adapter end-to-end test has been run for this candidate.",
  "Architecture-specific HardFault diagnostics are not implemented.",
  "RTOS awareness and ThreadX decoding are not validated.",
  "SVD peripheral access and telemetry backends are not implemented.",
  "The exact release candidate has not passed the isolated Skills CLI and CLI-install release gate.",
]
