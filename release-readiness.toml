# Formal Releases are intentionally blocked until every listed acceptance item is met.
[release]
stable_release_ready = false
blockers = [
  "No formal release candidate tag has been designated; the exact merged master commit has HIL evidence, but that evidence is not a release-candidate acceptance record.",
  "The reusable release gate has not run against an exact release wheel inside the protected release environment.",
]
minimum_scope = [
  "OpenOCD-configured target discovery and verified GDB/MI connection.",
  "Persistent GDB session with state, registers, variables, stack, breakpoints, and guarded run control.",
  "System-first tool discovery, safe authorization, and cross-platform package/Skill installation.",
  "Hardware HIL evidence for the exact candidate, clearly separated from Mock/CI evidence.",
]
roadmap = [
  "Validated architecture-specific HardFault analysis plugins.",
  "RTOS awareness compatibility and ThreadX control-block decoding.",
  "SVD peripheral descriptions with side-effect-aware register reads.",
  "RTT, trace, and non-intrusive telemetry backends.",
]
