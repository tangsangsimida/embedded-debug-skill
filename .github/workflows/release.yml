name: Release gate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release-gate:
    uses: ./.github/workflows/release-gate-reusable.yml
    permissions:
      contents: read
  publish:
    needs: release-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify tag and package versions match
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == f'v{version}', f'tag {tag} does not match package {version}'
          PY
      - name: Prepare release verification record
        run: |
          cat > release-test-record.md <<EOF2
          # Release verification

          - Version: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Gate: passed before this publish job started
          - Package build/install: passed
          - CLI --version, --help, doctor JSON: passed
          - Skills CLI installs: Codex and Claude Code filesystem/resource checks passed
          - Unit and mock GDB/MI tests: passed
          - Physical hardware: not tested by CI
          EOF2
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl release-test-record.md --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
