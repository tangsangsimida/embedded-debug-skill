name: Release gate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release-gate:
    uses: ./.github/workflows/release-gate-reusable.yml
    permissions:
      contents: read
  publish:
    needs: release-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag and package versions match
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == f'v{version}', f'tag {tag} does not match package {version}'
          PY
      - name: Download exact gated artifacts
        uses: actions/download-artifact@v4
        with:
          name: embedded-debug-skill-release
          # The artifact already contains the dist/ directory; downloading to
          # the repository root keeps the publish globs aligned with its layout.
          path: .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/release-test-record.md --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
