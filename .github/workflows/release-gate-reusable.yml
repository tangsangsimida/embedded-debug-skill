name: Reusable release gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - windows-2022
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
          - macos-26
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && mypy src/embedded_debug && pytest && python -m build && python -m pip check && pip-audit
      - run: python skills/embedded-debug/scripts/validate_skill.py skills/embedded-debug
      - run: python skills/embedded-debug/scripts/check_version.py
      - run: npx --yes skills-ref@0.1.5 validate skills/embedded-debug
  build-candidate:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - name: Verify tag and package versions match
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == f'v{version}', f'tag {tag} does not match package {version}'
          PY
      - name: Upload candidate package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embedded-debug-skill-candidate-package
          path: dist/*
          if-no-files-found: error
  install-candidate:
    needs: build-candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - windows-2022
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
          - macos-26
        agent: [codex, claude-code]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: embedded-debug-skill-candidate-package
          path: ${{ runner.temp }}/release-artifact
      - name: Install the Skill and exact release wheel
        env:
          SKILL_AGENT: ${{ matrix.agent }}
          EDBG_RELEASE_WHEEL_DIR: ${{ runner.temp }}/release-artifact
        run: python tests/ci/skill_install_smoke.py
  release-gate:
    needs: install-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: embedded-debug-skill-candidate-package
          path: dist
      - name: Enforce stable-release readiness
        run: python skills/embedded-debug/scripts/check_release_readiness.py
      - name: Record release candidate verification
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          cat > release-test-record.md <<EOF_RECORD
          # Release verification

          - Version: $version
          - Commit: $GITHUB_SHA
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Stable release gate: passed
          - Python 3.11 package/session matrix across Linux, Windows, macOS, x64, and arm64: passed
          - Codex and Claude Code Skill installs on all matrix platforms: passed
          - Exact release wheel install and CLI/doctor smoke tests: passed
          - Unit and Mock integration tests: passed
          - Physical hardware: not tested by CI
          EOF_RECORD
      - name: Upload gated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embedded-debug-skill-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-test-record.md
          if-no-files-found: error
