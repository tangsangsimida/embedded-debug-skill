name: Reusable release gate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && mypy src/embedded_debug && pytest && python -m build && pip-audit
      - run: python skills/embedded-debug/scripts/validate_skill.py skills/embedded-debug
      - run: python skills/embedded-debug/scripts/check_version.py
      - run: npx --yes skills-ref@0.1.5 validate skills/embedded-debug
      - name: Install exact wheel and smoke-test CLI
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --force-reinstall "$wheel"
          edbg --version
          edbg --help
          edbg doctor --json
      - name: Install and verify Codex Skill
        run: |
          npx --yes skills@1.7.6 add . --skill embedded-debug --agent codex --copy -g -y
          test -f "$HOME/.agents/skills/embedded-debug/SKILL.md"
        env:
          DISABLE_TELEMETRY: '1'
      - name: Install and verify Claude Code Skill
        run: |
          npx --yes skills@1.7.6 add . --skill embedded-debug --agent claude-code --copy -g -y
          test -f "$HOME/.claude/skills/embedded-debug/SKILL.md"
        env:
          DISABLE_TELEMETRY: '1'
      - name: Enforce stable-release readiness
        run: python skills/embedded-debug/scripts/check_release_readiness.py
      - name: Record candidate verification
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          cat > release-test-record.md <<EOF
          # Release verification

          - Version: $version
          - Commit: $GITHUB_SHA
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Stable release gate: passed
          - Python package build and install: passed
          - CLI version/help/doctor JSON: passed
          - Skills CLI Codex and Claude Code install checks: passed
          - Unit and mock integration tests: passed
          - Physical hardware: not tested by CI
          EOF
      - name: Upload the exact gated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embedded-debug-skill-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-test-record.md
          if-no-files-found: error
