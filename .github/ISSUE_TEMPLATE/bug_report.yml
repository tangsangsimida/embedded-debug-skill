name: Bug report
description: Report a reproducible CLI, GDB/MI, discovery, or Skill installation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, probe serials, firmware binaries, or proprietary source.
  - type: input
    id: version
    attributes:
      label: EmbeddedDebug-Skill version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted edbg doctor --json output
      render: json
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and expected behavior
    validations:
      required: true
